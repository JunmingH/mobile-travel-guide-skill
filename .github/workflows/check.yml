name: Skill checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: python -m pip install -r requirements.txt
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - run: node --test tests/test_crypto.mjs
      - run: python scripts/audit_package.py .
      - run: python vendor/travel-guide/scripts/audit_skill_consistency.py
      - run: python tests/make_fixture.py "${RUNNER_TEMP}/mobile-guide-fixture"
      - run: node tests/run_browser_tests.mjs "${RUNNER_TEMP}/mobile-guide-fixture"
