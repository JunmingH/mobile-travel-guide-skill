</style><script src="unlock.js" defer></script></head><body><main><small>YOUR TRAVEL COMPANION</small><h1>__APP_NAME__</h1><p>输入访问码，解锁你的随身旅行手册。</p><form id="unlock-form"><label for="code">访问码</label><input id="code" type="password" autocomplete="current-password" autocapitalize="none" spellcheck="false" required><p class="note">每次打开都需输入访问码；完成首次保存后，断网也能解锁。</p><button type="submit">打开旅行手册</button><p id="status" role="status" aria-live="polite">首次使用请保持联网。</p></form><p class="note">Safari → 分享 → 添加到主屏幕。请从新图标打开，并等到“离线已就绪”后再断网。</p><noscript>请在 Safari 中启用 JavaScript，才能解锁并使用旅行功能。</noscript></main></body></html>
